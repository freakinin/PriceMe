<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }
    .d1 { animation: dotPulse 3.2s ease-in-out 0.0s infinite; }
    .d2 { animation: dotPulse 3.2s ease-in-out 0.3s infinite; }
    .d3 { animation: dotPulse 3.2s ease-in-out 0.6s infinite; }
    .d4 { animation: dotPulse 3.2s ease-in-out 0.9s infinite; }
    .d5 { animation: dotPulse 3.2s ease-in-out 1.2s infinite; }
    .d6 { animation: dotPulse 3.2s ease-in-out 1.5s infinite; }
    .d7 { animation: dotPulse 3.2s ease-in-out 1.8s infinite; }
  </style>
  <rect width="100" height="100" rx="22" fill="#c2410c"/>
