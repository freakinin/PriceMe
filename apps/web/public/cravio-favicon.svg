  <circle class="d2" cx="44" cy="48" r="4" fill="#f0ede8"/>
  <circle class="d3" cx="58" cy="54" r="4" fill="#f0ede8"/>
  <circle class="d4" cx="38" cy="36" r="4" fill="#f0ede8"/>
  <circle class="d5" cx="65" cy="30" r="4" fill="#f0ede8"/>
  <circle class="d6" cx="52" cy="70" r="4" fill="#f0ede8"/>
  <circle class="d7" cx="72" cy="44" r="4" fill="#f0ede8"/>
</svg>
